// Enhanced WebSocket cleanup
function cleanupWebSockets() {
    console.log(`🔌 Cleaning up ${activeWebSockets.size} WebSocket connections`);
    
    activeWebSockets.forEach((ws, relay) => {
        // Remove all event listeners to prevent memory leaks
        ws.onopen = null;
        ws.onmessage = null;
        ws.onerror = null;
        ws.onclose = null;
        
        // Only close if connection is open or connecting
        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
            console.log(`🔌 Closing WebSocket for ${relay}`);
            try {
                ws.close(1000, "Search cancelled"); // Normal closure
            } catch (error) {
                console.warn(`⚠️ Error closing WebSocket for ${relay}:`, error);
            }
        }
    });
    
    activeWebSockets.clear();
    activeRelays = [];
}

// Fetch profile metadata (kind 0 events) for the given notes.
// Opens parallel WebSocket connections to the fallback relays.
async function fetchProfilesForNotesParallel(notes) {
    // Gather all unique pubkeys that are not already in profileCache
    const pubkeysToFetch = notes
        .map(note => note.pubkey)
        .filter((pubkey, index, self) => pubkey && !profileCache[pubkey] && self.indexOf(pubkey) === index);

    if (pubkeysToFetch.length === 0) {
        console.warn("⚠️ No new pubkeys to fetch.");
        return;
    }

    console.log(`🔍 Fetching profiles in parallel for:`, pubkeysToFetch);

    //  Open parallel WebSocket connections to `fallbackRelays`
    const metadataFetches = fallbackRelays.map(relay => fetchMetadataFromRelay(relay, pubkeysToFetch));

    //  Run all metadata fetches concurrently
    await Promise.all(metadataFetches);
}

// Opens a WebSocket to a relay and requests profile metadata.
// Resolves when the connection is closed (or times out).
async function fetchMetadataFromRelay(relay, pubkeys) {
    return new Promise((resolve) => {
        try {
            const ws = new WebSocket(relay);
            
            ws.onopen = () => {
                console.log(`🌍 Requesting Kind 0 metadata from ${relay}`);
                // Build filter: kind 0 events from the pubkeys
                const filter = { kinds: [0], authors: pubkeys };
                ws.send(JSON.stringify(["REQ", "profile_fetch", filter]));
            };

            ws.onmessage = (event) => {
                console.log(`📩 Message received from ${relay}`);
                try {
                    const data = JSON.parse(event.data);
                    console.log("🛠 Raw WebSocket Data:", data);

                    // Only process valid "EVENT" messages with kind 0
                    if (data[0] !== "EVENT" || !data[2] || data[2].kind !== 0) {
                        console.warn(`⚠️ Skipping irrelevant WebSocket event from ${relay}:`, data);
                        return;
                    }

                    // Parse profile JSON from the event's content
                    const profile = JSON.parse(data[2].content);
                    profileCache[data[2].pubkey] = {
                        name: profile.name || "Unknown",
                        picture: profile.picture || "",
                        nip05: profile.nip05 || "",
                    };

                    console.log(`✅ Metadata stored for ${data[2].pubkey}:`, profileCache[data[2].pubkey]);

                    //  Immediately update UI after metadata is fetched
                    updateProfileInUI(data[2].pubkey);
                } catch (error) {
                    console.error(`❌ Error processing message from ${relay}:`, error);
                }
            };

            ws.onerror = (error) => {
                console.error(`❌ WebSocket error on ${relay}:`, error);
            };

            ws.onclose = () => {
                console.log(`🔌 WebSocket closed from ${relay}`);
                resolve(); //  Resolve the promise when WebSocket closes
            };

            //  Set a timeout to close WebSocket if no response
            setTimeout(() => {
                if (ws.readyState === WebSocket.OPEN) {
                    console.warn(`⏳ Closing WebSocket due to timeout: ${relay}`);
                    ws.close();
                }
            }, 3000); // Close after 5 seconds

        } catch (error) {
            console.error(`❌ Failed to fetch metadata from ${relay}:`, error);
            resolve();
        }
    });
}

// Update the UI for a given pubkey.
function updateProfileInUI(pubkey) {
    const profile = profileCache[pubkey];

    if (!profile) {
        console.warn(`⚠️ No profile found for ${pubkey}, skipping update.`);
        return;
    }

    // console.log(`🔄 Updating UI for profile: ${pubkey}`);

    document.querySelectorAll(`.profile-img[data-pubkey="${pubkey}"]`).forEach(img => {
        if (profile.picture) {
            if (!profileImageFailures.has(pubkey)) {
                profileImageFailures.set(pubkey, 0);
            }

            let retryCount = profileImageFailures.get(pubkey);

            if (retryCount < 3) {
                img.src = profile.picture;
                img.onerror = () => {
                    retryCount++;
                    profileImageFailures.set(pubkey, retryCount);
                    console.warn(`🚨 Profile image failed (${retryCount}/3) for ${pubkey}: ${profile.picture}`);

                    if (retryCount >= 3) {
                        console.error(`❌ Stopping retries for ${pubkey}. Using fallback avatar.`);
                        img.src = `https://api.dicebear.com/11.x/fun-emoji/svg?seed=${pubkey}`;
                        img.onerror = null; // Stop further retries
                    }
                };
            } else {
                console.warn(`🛑 Already failed 3 times for ${pubkey}. Using fallback avatar.`);
                img.src = `https://api.dicebear.com/11.x/fun-emoji/svg?seed=${pubkey}`;
            }
        }
    });

    //  Update NIP-05 dynamically
    document.querySelectorAll(`.nip05[data-pubkey="${pubkey}"]`).forEach(nip05Element => {
        if (profile.nip05) {
            nip05Element.textContent = profile.nip05;
            console.log(`📛 NIP-05 updated for ${pubkey}: ${profile.nip05}`);
        }
    });
}





function truncateNip05(nip05) {
    if (nip05.length > 40) {
        const atIndex = nip05.indexOf("@");
        const domain = nip05.substring(atIndex);
        const truncated = `${nip05.substring(0, 10)}...${domain}`;
        return truncated;
    }
    return nip05;
}

// Calculate 'since' based on slider value
function calculateSinceTime(value) {
    const now = Math.floor(Date.now() / 1000);
    switch (value) {
        // case 0: return now;  // Now
        case 0:
            return now - 24 * 60 * 60; // 24 hours
        case 1:
            return now - 7 * 24 * 60 * 60; // Week
        case 2:
            return now - 30 * 24 * 60 * 60; // Month
        case 3:
            return now - 365 * 24 * 60 * 60; // Year
        case 4:
            return 0; // All time (🦕)
    }
}
// Kind 1: Note

function updateCounters() {
    const counters = document.getElementById("counters");
    const matchesCountText = document.getElementById("matchesCounter");

    if (!counters || !matchesCountText) return;

    // Get active keywords for filtering
    const activeKeywords = Object.keys(keywordStates).filter(k => keywordStates[k]);
    
    // Calculate filtered notes count
    const filteredNotes = allNotes.filter(note => {
        if (activeKeywords.length === 0) return true;
        const content = note.content.toLowerCase();
        
        if (requireAllKeywords) {
            return activeKeywords.every(keyword => 
                new RegExp(`\\b${keyword}\\b`, "gi").test(content)
            );
        } else {
            return activeKeywords.some(keyword => 
                new RegExp(`\\b${keyword}\\b`, "gi").test(content)
            );
        }
    });

    const displayedCount = document.querySelectorAll("#notes .note").length;
    const filteredCount = filteredNotes.length;
    const totalCount = allNotes.length;
    
    // Show different messages based on pagination state
    if (totalCount <= NOTES_PER_PAGE) {
        matchesCountText.textContent = `Showing all ${totalCount} notes`;
    } else {
        matchesCountText.textContent = `Showing ${displayedCount} of ${filteredCount} filtered notes (${totalCount} total)`;
    }

    if (totalCount === 0) {
        counters.style.display = "none";
    } else {
        counters.style.display = "flex";
    }
}

// Sort notes based on timestamp
function sortNotes() {
    if (allNotes.length === 0) {
        console.warn("⚠️ No notes to sort!");
        return;
    }

    console.log(`🔄 Sorting ${allNotes.length} notes: ${sortOrder === 'desc' ? 'Newest first' : 'Oldest first'}`);
    
    allNotes.sort((a, b) => {
        if (sortOrder === "desc") {
            return b.created_at - a.created_at; // Newest first
        } else {
            return a.created_at - b.created_at; // Oldest first
        }
    });

    // console.log(`📊 First note after sort: ${allNotes[0]?.created_at}`);
    // console.log(`📊 Last note after sort: ${allNotes[allNotes.length - 1]?.created_at}`);
}

function noteMatchesKeywords(content, activeKeywords) {
    return requireAllKeywords
        ? activeKeywords.every(keyword => new RegExp(`\\b${keyword}\\b`, "gi").test(content)) //  AND mode (ALL keywords must match)
        : activeKeywords.some(keyword => new RegExp(`\\b${keyword}\\b`, "gi").test(content));  //  OR mode (ANY keyword can match)
}

// The issue: NIP-50 relays default to AND search for multiple keywords
// Solution: For OR mode, we need to send individual search queries for each keyword

async function fetchNotes() {
    return new Promise(async (resolve, reject) => {
        if (isFetching) {
            console.log("⚠️ Fetch already in progress. Skipping...");
            abortController.abort();
            resolve();
            return;
        }
        
        abortController = new AbortController();
        isFetching = true;

        // Reset for new search
        if (currentPage === 1) {
            allNotes = [];
            fetchedNoteIds.clear();
        }

        console.log("🚀 Fetching notes with NIP-50 search...");

        // Clear UI
        document.getElementById("notes").innerHTML = "";
        updateCounters();

        const searchQuery = document.getElementById("keywordSearch").value.trim();
        
        // Process keywords for UI
        keywords.length = 0;
        keywordStates = {};
        if (searchQuery) {
            keywords.push(...searchQuery.split(" "));
            keywords.forEach((keyword) => {
                keywordStates[keyword] = true;
            });
        }

        console.log("🔍 Keywords:", keywords);
        console.log("🧲 Mode:", requireAllKeywords ? "AND" : "OR");

        const urlParams = new URLSearchParams(window.location.search);
        let selectedRelays = [];

        if (urlParams.has("r")) {
            // A page hands its own relays over here, but links made before the relay list was cleaned up still
            // carry relays that no longer answer (and relaying only to a dead host returns nothing), so the live
            // pool is added behind the page's own list. Duplicates collapse; the page's relays stay first.
            const fromPage = decodeURIComponent(urlParams.get("r")).split(",").filter(Boolean);
            selectedRelays = [...new Set([...fromPage, ...NIP50Relays])];
        } else {
            selectedRelays = getRandomRelays(NIP50Relays, 20);
        }

        startFetching();

        // FIXED: Different search strategies for AND vs OR modes
        const fetchPromises = selectedRelays.map(async (relay) => {
            if (activeWebSockets.has(relay)) {
                console.log(`⏩ Skipping ${relay} - already connected`);
                return;
            }

            try {
                const ws = new WebSocket(relay);
                activeWebSockets.set(relay, ws);

                let resultsReceived = false;
                let receivedCount = 0;
                let timeoutCheckInterval;
                let lastResultTime = Date.now();
                const SEARCH_TIMEOUT = 6000;

                const connectionTimeout = setTimeout(() => {
                    if (ws.readyState === WebSocket.CONNECTING) {
                        console.warn(`⏰ Connection timeout for ${relay}`);
                        ws.close();
                    }
                }, 5000);

                console.log(`🌍 Connecting to ${relay}`);

                ws.onopen = () => {
                    console.log(`✅ Connected to ${relay}`);
                    
                // ✅ Use your excellent timeToMaxNotes limits
                const dynamicLimit = timeToMaxNotes[timeRange];
                console.log(`🎯 Using limit: ${dynamicLimit} notes for ${getTimeRangeLabel(timeRange)}`);
                
                if (requireAllKeywords) {
                    // AND mode: Single search with full dynamic limit
                    const filter = {
                        kinds: [1],
                        limit: dynamicLimit, // ✅ Fixed!
                        since: calculateSinceTime(timeRange),
                        search: keywords.join(" ")
                    };
                    ws.send(JSON.stringify(["REQ", "nip50_search", filter]));
                    // Every keyword as a hashtag too: `search` is a NIP-50 extension a relay may ignore, while
                    // `#t` is a plain filter every relay understands. Duplicates are dropped by note id.
                    ws.send(JSON.stringify(["REQ", "tag_search",
                        { kinds: [1], limit: dynamicLimit, since: calculateSinceTime(timeRange), "#t": keywords }]));
                } else {
                    // OR mode: Multiple searches with distributed limits
                    const individualLimit = Math.floor(dynamicLimit / keywords.length);
                    keywords.forEach((keyword, index) => {
                        const filter = {
                            kinds: [1],
                            limit: individualLimit, // ✅ Fixed!
                            since: calculateSinceTime(timeRange),
                            search: keyword
                        };
                        ws.send(JSON.stringify(["REQ", `nip50_or_${index}`, filter]));
                        ws.send(JSON.stringify(["REQ", `tag_or_${index}`,
                            { kinds: [1], limit: individualLimit, since: calculateSinceTime(timeRange), "#t": [keyword] }]));
                    });
                }
                    
                    timeoutCheckInterval = setInterval(() => {
                        if (Date.now() - lastResultTime > SEARCH_TIMEOUT && ws.readyState === WebSocket.OPEN) {
                            console.log(`⏰ No new results from ${relay} for ${SEARCH_TIMEOUT}ms, closing connection`);
                            clearInterval(timeoutCheckInterval);
                            ws.close();
                        }
                    }, 500);
                };

                ws.onmessage = (event) => {
                    if (abortController.signal.aborted) {
                        console.warn(`⚠️ Fetch aborted. Closing WebSocket for ${relay}`);
                        clearInterval(timeoutCheckInterval);
                        ws.close();
                        return;
                    }

                    const data = JSON.parse(event.data);
                    if (!data || data.length < 3 || data[0] !== "EVENT") return;

                    const note = data[2];
                    const noteId = note.id;
                    receivedCount++;

                    lastResultTime = Date.now();

                    // Ignore banned profiles
                    const bannedProfiles = JSON.parse(localStorage.getItem("clientBannedProfiles")) || [];
                    if (bannedProfiles.includes(note.pubkey)) {
                        console.warn(`🚫 Ignoring note from banned profile: ${note.pubkey}`);
                        return;
                    }

                    // Add to allNotes if not already present
                    if (!fetchedNoteIds.has(noteId)) {
                        fetchedNoteIds.add(noteId);

                        if (!note.content) {
                            console.warn(`⚠️ Note is missing content. Skipping.`);
                            return;
                        }

                        if (!allNotes.some(n => n.id === note.id)) {
                            allNotes.push(note);
                            console.log("📝 Added note to allNotes:", {
                                id: note.id.slice(0, 8),
                                created_at: note.created_at,
                                content_length: note.content?.length || 0
                            });
                        }

                        resultsReceived = true;
                        
                        // Update UI with current pagination
                        applyPagination();
                        updateCounters(); // the count changes as each note lands, not only on a reset
                        fetchProfilesForNotesParallel(displayedNotes);
                    }
                };

                ws.onclose = () => {
                    console.warn(`❌ Disconnected from ${relay}`);
                    activeWebSockets.delete(relay);
                    clearInterval(timeoutCheckInterval);
                    clearTimeout(connectionTimeout);

                    console.log(`📊 Relay: ${relay}`);
                    console.log(`📩 Total notes received: ${receivedCount}`);
                    console.log(`📢 Notes currently in allNotes: ${allNotes.length}`);

                    activeRelays = activeRelays.filter(r => r !== relay.replace("wss://", "").replace("/", ""));
                };

                ws.onerror = (error) => {
                    console.error(`⚠️ Connection error on ${relay}:`, error);
                    activeWebSockets.delete(relay);
                    activeRelays = activeRelays.filter(r => r !== relay.replace("wss://", "").replace("/", ""));
                };

                setTimeout(() => {
                    if (resultsReceived && ws.readyState === WebSocket.OPEN) {
                        console.log(`Closing WebSocket after receiving results from ${relay}`);
                        clearInterval(timeoutCheckInterval);
                        ws.close();
                    }
                }, 5000);

                setTimeout(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        console.warn(`Closing WebSocket due to timeout: ${relay}`);
                        clearInterval(timeoutCheckInterval);
                        ws.close();
                    }
                }, 15000);
            } catch (error) {
                console.error(`❌ Failed to fetch from relay: ${relay}`, error);
                activeWebSockets.delete(relay);
            }
        });
        
        await Promise.allSettled(fetchPromises);

        console.log(`✅ Search complete. Fetched ${allNotes.length} notes.`);
        
        // Debug: Check what keywords were actually found
        console.log("🔍 SEARCH RESULTS ANALYSIS:");
        keywords.forEach(keyword => {
            const count = allNotes.filter(note => 
                new RegExp(`\\b${keyword}\\b`, "gi").test(note.content)
            ).length;
            console.log(`  - "${keyword}": ${count} notes`);
        });

        if (allNotes.length > 0) {
            fetchingSuccess();
        } else {
            fetchingNoMatches();
        }

        // Apply pagination to display current page
        applyPagination();

        // Fetch profiles for displayed notes only
        await fetchProfilesForNotesParallel(displayedNotes);

        updateCounters();

        isFetching = false;
        resolve();
    });
}

// Connection health monitoring
function checkConnectionHealth() {
    const now = Date.now();
    let healthyConnections = 0;
    
    activeWebSockets.forEach((ws, relay) => {
        // Check if connection is stuck or unhealthy
        if (ws.readyState === WebSocket.CONNECTING && (now - ws._createdAt > 10000)) {
            console.warn(`🩺 Unhealthy connection to ${relay} - closing`);
            ws.close();
        } else if (ws.readyState === WebSocket.OPEN) {
            healthyConnections++;
        }
    });
    
    console.log(`🩺 Connection health: ${healthyConnections} healthy, ${activeWebSockets.size} total`);
    return healthyConnections;
}

setInterval(() => {
    if (isFetching) {
        checkConnectionHealth();

}, 5000);

// Helper function to shorten pubkey (e.g., abc1...def9)
function shortenPubKey(pubkey) {
    if (pubkey.length > 8) {
        return `${pubkey.slice(0, 4)}...${pubkey.slice(-4)}`;
    }
    return pubkey; // Return full key if it's unusually short
}

// 1. Highlight Keywords and URLs
function highlightContent(content) {
    // Highlight https:// links (clickable, dark blue)
    content = content.replace(/https:\/\/\S+/gi, (match) => {
        let highlightedLink = match;
        // Highlight keyword inside the link
        keywords.forEach((keyword) => {
            const regex = new RegExp(`(${keyword})`, "gi");
            highlightedLink = highlightedLink.replace(
                regex,
                '<span style="color: blue;">$1</span>'
            );
        });

        return `<a href="${match}" target="_blank" style="color: darkblue; text-decoration: underline;">${highlightedLink}</a>`;
    });

    // Highlight http:// links (non-clickable, grey)
    content = content.replace(/http:\/\/\S+/gi, (match) => {
        let highlightedText = match;
        keywords.forEach((keyword) => {
            const regex = new RegExp(`(${keyword})`, "gi");
            highlightedText = highlightedText.replace(
                regex,
                '<span style="color: blue;">$1</span>'
            );
        });

        return `<span style="color: grey;">${highlightedText}</span>`;
    });

    // Highlight hashtags #keyword (green, bold)
    keywords.forEach((keyword) => {
        const hashtagRegex = new RegExp(`#(${keyword})\\b`, "gi");
        content = content.replace(
            hashtagRegex,
            '<span class="hashtag">#$1</span>'
        );
    });

    // Highlight regular keywords (not inside links or hashtags) in purple
    keywords.forEach((keyword) => {
        const normalRegex = new RegExp(
            `(?<![/])(?<!https:|http:)\\b(${keyword})\\b`,
            "gi"
        );
        content = content.replace(
            normalRegex,
            '<span class="highlight">$1</span>'
        );
    });

    return content;
}

function toggleHide(noteId) {
    const noteElement = document.querySelector(`.note-content[data-note-id="${noteId}"]`).parentElement;
    const noteHeader = noteElement.querySelector(".note-header"); //  Select metadata
    const eyeButton = noteElement.querySelector(".hide-eye-button img"); //  Select eye icon
    const bombButton = noteElement.querySelector(".ban-profile-button"); // Bomb icon

    if (hiddenNotes.has(noteId)) {
        hiddenNotes.delete(noteId); //  Remove from hidden state
        localStorage.setItem("hiddenNotes", JSON.stringify([...hiddenNotes])); //  Save updated hidden notes list
        noteElement.classList.remove("hidden");
        if (noteHeader) noteHeader.style.display = "flex"; //  Show metadata
        eyeButton.src = "img/othrIcon/eye_view.png"; //  Change to "view" icon
        if (bombButton) bombButton.style.display = "none"; // Hide bomb icon
    } else {
        hiddenNotes.add(noteId); //  Mark as hidden
        localStorage.setItem("hiddenNotes", JSON.stringify([...hiddenNotes])); //  Save updated hidden notes list
        noteElement.classList.add("hidden");
        if (noteHeader) noteHeader.style.display = "none"; //  Hide metadata
        eyeButton.src = "img/othrIcon/eye_hide.png"; //  Change to "hide" icon
        if (bombButton) bombButton.style.display = "block"; // Show bomb icon
    }
}

function banProfile(pubkey) {
    console.log(`💣 Banning profile: ${pubkey}`);

    // Load existing banned profiles from localStorage
    let bannedProfiles = JSON.parse(localStorage.getItem("clientBannedProfiles")) || [];

    // Only add if not already banned
    if (!bannedProfiles.includes(pubkey)) {
        bannedProfiles.push(pubkey);
        localStorage.setItem("clientBannedProfiles", JSON.stringify(bannedProfiles));
    }

    // Remove all notes from this profile from the feed
    const removedNotes = notes.filter(note => note.pubkey === pubkey).length;
    notes = notes.filter(note => note.pubkey !== pubkey);
    updateNotes(); // Refresh feed

    // Update match counter
    matchCount -= removedNotes;
    updateCounters();

    console.log(` Removed ${removedNotes} notes from banned profile: ${pubkey}`);
}

// Track image retry attempts
const imageRetries = new Map();

// Function to retry loading images up to 3 times
function handleImageError(img) {
    const originalSrc = img.dataset.originalSrc || img.src;

    // Store the original src if not already stored
    if (!img.dataset.originalSrc) {
        img.dataset.originalSrc = originalSrc;
    }

    // Initialize retry count if not present
    if (!imageRetries.has(originalSrc)) {
        imageRetries.set(originalSrc, 0);
    }

    let retryCount = imageRetries.get(originalSrc);

    if (retryCount < 3) {
        console.warn(`Retrying image: ${originalSrc} (Attempt ${retryCount + 1}/3)`);
        imageRetries.set(originalSrc, retryCount + 1);

        // Apply a low-opacity blur effect while retrying
        img.style.filter = "blur(5px)";
        img.style.opacity = "0.5";

        // Create a temporary new image to check if the source is valid before applying
        const tempImg = new Image();
        tempImg.src = originalSrc + "?retry=" + Date.now();
        tempImg.onload = function () {
            // Remove blur & opacity when successfully loaded
            img.style.filter = "";
            img.style.opacity = "1";
            img.src = tempImg.src; // Update source only after confirming it's valid
        };
        
        tempImg.onerror = function () {
            console.error(`Image retry failed: ${originalSrc} (Attempt ${retryCount + 1}/3)`);
        };
    } else {
        console.error(`Failed to load image after 3 attempts: ${originalSrc}`);
        img.src = "https://via.placeholder.com/150?text=Image+Unavailable"; // Placeholder
        img.style.filter = ""; // Reset styles
        img.style.opacity = "1";
        img.onerror = null; // Prevent infinite loop
    }
}

// Avoid duplicate event listeners

// Attach error handling to all dynamically loaded images

    document.querySelectorAll(".note-content img").forEach((img) => {
        if (!img.dataset.errorHandler) {

            img.onerror = function () {

            };
        }
    });
}

    isObserving = true;
}

function copyToClipboard(noteId) {
    if (!noteId || noteId === "null") {
        console.error("❌ Error: Trying to copy an invalid Note ID.");
        alert("Error: Invalid Note ID. Copy failed.");
        return;
    }

    navigator.clipboard
        .writeText(noteId)
        .then(() => {
            console.log(`✅ Note ID copied: ${noteId}`);
            alert(`Note ID: ${noteId} \nCopied to clipboard`);
        })
        .catch((err) => {
            console.error("❌ Failed to copy: ", err);
            alert("Error: Could not copy Note ID.");
        });
}

document.getElementById("magnetButton").addEventListener("click", function () {

    if (requireAllKeywords) {
        this.classList.add("active");  // Force Green (AND Mode)
        this.title = "Showing notes with ALL keywords";

    } else {
        this.classList.remove("active"); // Force Grey (OR Mode)
        this.title = "Showing notes with ANY keyword";
        this.textContent = "ANY";
    }

    console.log(`🧲 Magnet Mode: ${requireAllKeywords ? "ON (AND Search)" : "OFF (OR Search)"}`);
    // Show immediate feedback
    const activeKeywords = Object.keys(keywordStates).filter(k => keywordStates[k]);
    console.log(`🔍 Active keywords: ${activeKeywords.join(', ')}`);
    console.log(`🎯 Mode: ${requireAllKeywords ? 'AND (all must match)' : 'OR (any can match)'}`);

    // Check if we have existing notes to filter
    const hasExistingNotes = allNotes.length > 0;
    
    // Check URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const hasSearchParams = urlParams.has("h");
    
    // Check if user has manually typed something
    const inputBox = document.getElementById("keywordSearch");
    const inputNotEmpty = inputBox.value.trim() !== "";

    console.log(`📊 State: ${hasExistingNotes ? 'Has notes' : 'No notes'}, ${hasSearchParams ? 'URL params' : 'No URL params'}, ${inputNotEmpty ? 'Manual input' : 'No manual input'}`);

    // DECISION LOGIC: When to filter vs when to search
    if (hasExistingNotes) {
        // Case 1: We already have notes - just filter them
        console.log("🔄 Re-filtering existing notes with new mode...");
        applyPagination(); // Re-filter existing notes
        
    } else if (hasSearchParams && !inputNotEmpty) {
        // Case 2: URL parameters but no manual input - trigger search with current mode
        console.log("🔎 URL parameters detected, triggering search with current mode...");
        if (!isFetching) {
            triggerSearch(); // Use triggerSearch to handle the search properly
        } else {
            console.warn("⚠️ Fetch already in progress. Skipping...");
        }
        
    } else if (inputNotEmpty) {
        // Case 3: Manual input - trigger search with current mode
        console.log("🔎 Manual input detected, triggering search with current mode...");
        if (!isFetching) {
            triggerSearch(); // Use triggerSearch to handle the search properly
        } else {
            console.warn("⚠️ Fetch already in progress. Skipping...");
        }
        
    } else {
        // Case 4: No notes, no URL params, no manual input - just update UI
        console.log("ℹ️ No search criteria available");
        updateCounters();
    }
});

// Apply pagination to display current page
function applyPagination() {
    console.log("🔄 applyPagination called");
    console.log("📊 allNotes length:", allNotes.length);
    console.log("📊 NOTES_PER_PAGE:", NOTES_PER_PAGE);
    console.log("📊 currentPage:", currentPage);
    
    // Sort all notes first
    sortNotes();
    
    // Get active keywords for filtering
    const activeKeywords = Object.keys(keywordStates).filter(k => keywordStates[k]);
    
    // DEBUG: Check what's happening with filtering
    console.log("🔍 FILTERING DEBUG:");
    console.log("🔑 Active keywords:", activeKeywords);
    console.log("🧲 Magnet mode:", requireAllKeywords ? "AND (ALL must match)" : "OR (ANY can match)");
    
    // Filter allNotes based on keywords (BEFORE pagination)
    const filteredNotes = allNotes.filter((note) => {
        if (activeKeywords.length === 0) {
            console.log("🔍 No active keywords - showing all notes");
            return true; // Show all notes if no active keywords
        }
        
        const content = note.content.toLowerCase();
        
        // DEBUG: Check individual note matching
        const keywordMatches = activeKeywords.map(keyword => {
            const regex = new RegExp(`\\b${keyword}\\b`, "gi");
            const matches = regex.test(content);
            return { keyword, matches };
        });
        
        if (requireAllKeywords) {
            // AND mode: ALL keywords must match
            const allMatch = keywordMatches.every(m => m.matches);
            if (allMatch) {
                console.log(`✅ Note matches ALL keywords:`, keywordMatches);
            }
            return allMatch;
        } else {
            // OR mode: ANY keyword can match
            const anyMatch = keywordMatches.some(m => m.matches);
            if (anyMatch) {
                console.log(`✅ Note matches ANY keyword:`, keywordMatches);
            }
            return anyMatch;
        }
    });

    console.log("📊 Filtered notes:", filteredNotes.length, "out of", allNotes.length);
    
    // If no filtered notes but we have allNotes, debug why
    if (filteredNotes.length === 0 && allNotes.length > 0) {
        console.log("🔍 DEBUG: Why no filtered notes?");
        console.log("🔑 Keywords:", activeKeywords);
        console.log("🧲 Mode:", requireAllKeywords ? "AND" : "OR");
        console.log("📝 Sample notes content:");
        allNotes.slice(0, 3).forEach((note, i) => {
            console.log(`  Note ${i}: ${note.content.substring(0, 100)}...`);
        });
    }
    
    // Apply pagination to filtered results
    const startIndex = (currentPage - 1) * NOTES_PER_PAGE;
    const endIndex = startIndex + NOTES_PER_PAGE;
    
    console.log("📊 startIndex:", startIndex, "endIndex:", endIndex);
    
    displayedNotes = filteredNotes.slice(startIndex, endIndex);
    
    console.log("📊 displayedNotes after pagination:", displayedNotes.length);
    
    // Update UI
    updateNotes();
    updateCounters();
    updatePaginationControls(); // This handles hiding controls when fewer notes
}

// Remove pagination controls when using infinite scroll
function updatePaginationControls() {
    // Calculate filtered notes count
    const activeKeywords = Object.keys(keywordStates).filter(k => keywordStates[k]);
    const filteredNotes = allNotes.filter((note) => {
        if (activeKeywords.length === 0) return true;
        const content = note.content.toLowerCase();
        
        if (requireAllKeywords) {
            return activeKeywords.every(keyword => 
                new RegExp(`\\b${keyword}\\b`, "gi").test(content)
            );
        } else {
            return activeKeywords.some(keyword => 
                new RegExp(`\\b${keyword}\\b`, "gi").test(content)
            );
        }
    });

    const filteredCount = filteredNotes.length;
    const totalPages = Math.ceil(filteredCount / NOTES_PER_PAGE);
    
    // Only update if pagination state actually changed
    const currentState = {
        shouldShow: totalPages > 1 && filteredCount > NOTES_PER_PAGE,
        totalPages: totalPages,
        currentPage: currentPage,
        filteredCount: filteredCount
    };
    
    // Check if state changed
    const stateChanged = JSON.stringify(currentState) !== JSON.stringify(lastPaginationState);
    
    if (!stateChanged) {
        console.log("📄 Pagination state unchanged, skipping update");
        return;
    }
    
    lastPaginationState = currentState;
    
    // Remove ALL existing pagination controls
    const allPaginationControls = document.querySelectorAll('#paginationControls, .pagination-controls');
    allPaginationControls.forEach(control => control.remove());
    
    console.log(`🗑️ Removed ${allPaginationControls.length} old pagination controls`);
    
    if (currentState.shouldShow) {
        const paginationHTML = `
            <div id="paginationControls" class="pagination-controls">
                <button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>⏮ First</button>
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>◀ Previous</button>
                <span class="page-info">Page ${currentPage} of ${totalPages}</span>
                <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next ▶</button>
                <button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>Last ⏭</button>
            </div>
        `;
        
        const notesContainer = document.getElementById('notes');
        if (notesContainer) {
            notesContainer.insertAdjacentHTML('afterend', paginationHTML);
            console.log("📄 Added pagination control:", totalPages, "pages,", filteredCount, "filtered notes");
        }
    } else {
        console.log("📄 Pagination hidden:", filteredCount, "filtered notes");
    }
}

// Also fix the immediate issue - remove all stacked controls
function cleanupStackedPagination() {
    const stackedControls = document.querySelectorAll('#paginationControls, .pagination-controls');
    if (stackedControls.length > 1) {
        console.warn(`⚠️ Found ${stackedControls.length} stacked pagination controls!`);
        
        // Keep only the last one
        for (let i = 0; i < stackedControls.length - 1; i++) {
            stackedControls[i].remove();
        }
        
        console.log(`✅ Cleaned up ${stackedControls.length - 1} stacked controls`);
    }
}

// Run cleanup immediately
cleanupStackedPagination();


// Navigate to specific page
function goToPage(page) {
    // Calculate filtered notes count (same logic as updatePaginationControls)
    const activeKeywords = Object.keys(keywordStates).filter(k => keywordStates[k]);
    const filteredNotes = allNotes.filter((note) => {
        if (activeKeywords.length === 0) return true;
        const content = note.content.toLowerCase();
        
        if (requireAllKeywords) {
            return activeKeywords.every(keyword => 
                new RegExp(`\\b${keyword}\\b`, "gi").test(content)
            );
        } else {
            return activeKeywords.some(keyword => 
                new RegExp(`\\b${keyword}\\b`, "gi").test(content)
            );
        }
    });

    const filteredCount = filteredNotes.length;
    const totalPages = Math.ceil(filteredCount / NOTES_PER_PAGE);
    
    if (page < 1 || page > totalPages) return;
    
    currentPage = page;
    applyPagination();
    
    // Scroll to top of notes
    document.getElementById('notes').scrollIntoView({ behavior: 'smooth' });
}

// Load more notes (infinite scroll alternative)
function loadMoreNotes() {
    if (isFetching) {
        console.log('⏳ Already fetching, skipping load more...');
        return;
    }
    
    const totalPages = Math.ceil(allNotes.length / NOTES_PER_PAGE);
    if (currentPage >= totalPages) {
        console.log('📄 No more pages to load');
        return;
    }
    
    currentPage++;
    console.log(`📄 Loading page ${currentPage} of ${totalPages}`);
    applyPagination();
}

function setupInfiniteScroll() {
    const notesContainer = document.getElementById('notes');
    
    if (!notesContainer) {
        console.warn('Notes container not found for infinite scroll');
        return;
    }
    
    console.log('🔄 Setting up infinite scroll on notes container');
    
    // Remove existing scroll listener to prevent duplicates
    notesContainer.removeEventListener('scroll', handleInfiniteScroll);
    
    function handleInfiniteScroll() {
        const { scrollTop, scrollHeight, clientHeight } = notesContainer;
        
        // Load more when near bottom (80% scrolled)
        if (scrollTop + clientHeight >= scrollHeight * 0.8) {
            const totalPages = Math.ceil(allNotes.length / NOTES_PER_PAGE);
            if (currentPage < totalPages && !isFetching) {
                console.log('📜 Loading more notes via infinite scroll...');
                loadMoreNotes();
            }
        }
    }
    
    notesContainer.addEventListener('scroll', handleInfiniteScroll);
}

// Auto-fetch keywords and relays from URL and trigger search on page load
window.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const keywordsFromURL = urlParams.get("h") || ""; //  Get `h=` parameter
    console.log("🌍 Extracted Keywords from URL:", keywordsFromURL);
    const relaysFromURL = urlParams.get("r"); // Get 'r' parameter (relays)
    const magnetButton = document.getElementById("magnetButton");
    // Reset keywords array properly
    keywords.length = 0;

    setupInfiniteScroll();

    if (keywordsFromURL) {
        // URL parameters exist - set up the search but don't auto-trigger yet

        // IMPORTANT: Don't automatically activate magnet for URL parameters
        // Let the user decide if they want AND or OR mode
        console.log("🔄 `h=` detected, setting search mode to AND (ALL keywords required).");
        requireAllKeywords = false; //  // Default to OR mode for URL parameters
        magnetButton.classList.remove("active");  // Ensure Grey (OR mode)
        
        console.log("🔄 `h=` detected, setting up search with OR mode by default.");
        console.log("ℹ️ User can click magnet button to switch to AND mode if desired.");

        // Decode, remove hashtags (#), and replace commas with spaces
        let keywordArray = decodeURIComponent(keywordsFromURL)
            .replace(/%23/g, '')  // Remove encoded `#`
            .replace(/#/g, '')  // Remove any remaining `#`
            .replace(/,/g, ' ')  // Replace commas with spaces
            .split(/\s+/); // Split by spaces

        // Ensure we only add valid keywords
        if (keywordArray.length > 0 && keywordArray[0] !== "") {
            document.getElementById("keywordSearch").value = keywordArray.join(" ");

            //  Reset `keywords` to ensure it's fresh
            keywords.length = 0;
            keywords.push(...keywordArray);

            //  Ensure all keywords are active
            keywordStates = {};
            keywords.forEach(keyword => {
                keywordStates[keyword] = true;
            });

            console.log("✅ Keywords Loaded for Search:", keywords);

            // Set up for better search results
            timeRange = 4; // Set slider to 'All Time'
            maxNotes = timeToMaxNotes[timeRange];
            document.getElementById("timeRangeSlider").value = 4;
            
            updateTitleWithKeywords();
            
            // The visitor arrived from a page whose hashtags are in the URL: that is the search, so run it.
            // Waiting for a button press left every inbound link on an empty page with "Fetching..." on it.
            console.log("ℹ️ Search ready - starting it for the hashtags in the link.");
            setTimeout(() => triggerSearch(), 250);

        } else {
            console.warn("⚠️ No valid keywords found in URL.");
        }
    } else {
        // No URL parameters - default behavior
        requireAllKeywords = false; // Default to OR mode
        magnetButton.classList.remove("active"); // Ensure Grey
        console.log("ℹ️ No URL parameters. Ready for manual search.");
    }

    // Load relays if available
    if (relaysFromURL) {
        const relayArray = decodeURIComponent(relaysFromURL).split(",");
        if (relayArray.length > 0 && relayArray[0] !== "") {
            fallbackRelays.length = 0;
            fallbackRelays.push(...relayArray);
            console.log("🔄 Using custom relays:", fallbackRelays);
        }
    }

    console.log("🎯 Ready. Type a keyword and press search.");
});
